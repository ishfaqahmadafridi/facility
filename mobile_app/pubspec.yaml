name: facility
description: SUPERAPP Pakistan — Ride, Nurse, Repair, Roadside in one app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────────
  provider: ^6.1.2

  # ── Networking ──────────────────────────────────────────────────
  http: ^1.2.1
  dio: ^5.4.3+1

  # ── WebSocket / Real-time ────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Storage ─────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # ── Auth ────────────────────────────────────────────────────────
  jwt_decoder: ^2.0.1

  # ── Maps ────────────────────────────────────────────────────────
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # ── Images ──────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # ── UI Utilities ─────────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.2.5
  pin_code_fields: ^8.0.1     # OTP input
  shimmer: ^3.0.0             # skeleton loaders

  # ── Utils ───────────────────────────────────────────────────────
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
